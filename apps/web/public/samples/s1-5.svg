" cy="110" rx="62" ry="38" fill="#9fb27a"/><ellipse cx="110" cy="100" rx="62" ry="30" fill="#b8c98f"/><text x="110" y="160" font-size="9" text-anchor="middle" fill="#5a4a32" font-family="Helvetica, Arial">real photo</text><text x="110" y="200" font-size="18" text-anchor="middle" fill="#2f3a2c" font-family="Georgia, serif">Matcha Basque</text><text x="110" y="222" font-size="18" text-anchor="middle" fill="#2f3a2c" font-family="Georgia, serif">Cheesecake</text><text x="110" y="256" font-size="11" text-anchor="middle" fill="#2f3a2c" font-family="Helvetica, Arial">For your 8 a.m. walk to</text><text x="110" y="270" font-size="11" text-anchor="middle" fill="#2f3a2c" font-family="Helvetica, Arial">Seongsu · ₩6,500</text></g><rect x="250" y="716" width="970" height="56" rx="28" fill="#ffffff" stroke="#d6d6db"/><text x="280" y="750" font-size="16" font-family="Helvetica, Arial" fill="#a0a0a8">Message AI Assistant</text></svg>